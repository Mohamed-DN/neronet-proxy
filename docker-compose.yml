# ==============================================================================
# NeroNet Sovereign Mesh Enterprise Management Console - Local Staging (R8)
# Multi-Container Compose Stack (PostgreSQL 16, Valkey 7, Backend API, Nginx SPA)
# 
# 🔒 macOS Host Routing Safety Invariant:
# - All host port bindings are 100% restricted to loopback (127.0.0.1).
# - Zero host routing table modifications; zero interference with Tailscale.
# ==============================================================================

services:
  # 1. PostgreSQL 16 with PostGIS & pgvector
  postgres:
    # Stays on the PostGIS image on purpose, even though migration 004 removes
    # every use of PostGIS. An existing database still holds coordinates inside a
    # geometry column, and reading them out requires a loadable PostGIS library.
    # Switching this image before migration 004 has run makes ST_X/ST_Y unavailable
    # and the migration will refuse to proceed rather than drop the column.
    #
    # Once 004 shows in the _migrations table, this can safely become
    # postgres:16-alpine -- nothing in the schema references PostGIS any more.
    image: postgis/postgis:16-3.4-alpine
    container_name: neronet_staging_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=neronet
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=neronet_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neronet -d neronet_db"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - neronet-isolated-mesh

  # 2. Valkey 7 (Redis-compatible In-Memory State Bus & Session Store)
  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: neronet_staging_valkey
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - neronet-isolated-mesh

  # 3. Control Plane REST & WebSocket API Backend (Node.js 22)
  backend:
    build:
      context: ./console/backend
      dockerfile: Dockerfile
    container_name: neronet_staging_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=8081
      - HOST=0.0.0.0
      # Secrets come from the environment or a local .env file, never from this
      # committed file. The `:?` form makes Compose refuse to start when one is
      # unset, which is the point: this service runs with NODE_ENV=production, so a
      # baked-in default here is a production credential published on GitHub.
      - DATABASE_URL=postgresql://neronet:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/neronet_db
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=neronet
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=neronet_db
      - VALKEY_URL=redis://valkey:6379
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - SOVEREIGN_JWT_SECRET=${SOVEREIGN_JWT_SECRET:?set SOVEREIGN_JWT_SECRET in .env}
      - SOVEREIGN_REFRESH_SECRET=${SOVEREIGN_REFRESH_SECRET:?set SOVEREIGN_REFRESH_SECRET in .env}
      - SOVEREIGN_ADMIN_PASS=${SOVEREIGN_ADMIN_PASS:?set SOVEREIGN_ADMIN_PASS in .env}
      # Shared enrolment token for Go data-plane nodes. Without it the bridge refuses
      # to enrol anyone in production, since /v4/control/register writes to the node
      # table and hands out overlay addresses.
      - SOVEREIGN_REGISTRATION_TOKEN=${SOVEREIGN_REGISTRATION_TOKEN:?set SOVEREIGN_REGISTRATION_TOKEN in .env}
      - SOVEREIGN_DATA_DIR=/app/data
      - CORS_ORIGIN=http://127.0.0.1:8443,http://localhost:8443,http://127.0.0.1:8081,http://localhost:8081
    # Unprivileged, with a read-only root filesystem. Only /app/data is writable,
    # and only because the federation identity and the SQLite file live there.
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      # The mesh's Ed25519 federation identity lives here. Without a volume it is
      # regenerated on every container recreation, which silently invalidates every
      # peering token already handed to a partner.
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - neronet-isolated-mesh

  # 4. Enterprise Frontend SPA (Nginx 1.27 Reverse Proxy)
  frontend:
    build:
      context: ./console/frontend
      dockerfile: Dockerfile
    container_name: neronet_staging_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8443/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - neronet-isolated-mesh

networks:
  neronet-isolated-mesh:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

volumes:
  backend_data:
    driver: local
  postgres_data:
    driver: local
  valkey_data:
    driver: local
