# NeroNet development stack.
#
#   core services (always):  postgres, valkey, backend, frontend
#   profile "nodes":         two DERP relays and thirteen Go nodes enrolling through nginx
#   profile "debug-ports":   publishes PostgreSQL and Valkey on the host loopback
#   profile "backup":        encrypted, periodic backups of the database and the backend
#                            data volume, copied to a second repository
#   profile "restore":       what scripts/ops/restore.sh starts for a restore or a
#                            verification; never started by `up`
#
# Several stacks can run side by side on one host. Set COMPOSE_PROJECT_NAME and the
# NERONET_*_PORT variables to different values for each; scripts/dev/stack.sh does
# both. No service sets container_name, so nothing collides by name, and no subnet
# is pinned. Volume names derive from the project name: do not add a top-level
# `name:`, because an existing stack keeps its data only while its project name stays
# the same.
#
# Every host port is bound to 127.0.0.1. The console's address can be changed with
# NERONET_CONSOLE_BIND, which a deployment that serves a public domain needs; with
# NERONET_TLS_MODE=acme, docker-compose.acme.yml also publishes the HTTP-01
# listener (host 8080 by default). A public deployment forwards public port 80 to it.

x-node-build: &node-build
  # Every node-image service builds from the same recipe. Naming the image once
  # lets Compose build it a single time per `up --build`.
  build:
    context: .
    dockerfile: docker/Dockerfile.node
  image: ${NERONET_NODE_IMAGE:-neronet-node:dev}
  restart: unless-stopped
  networks:
    - neronet-isolated-mesh

x-node: &node
  <<: *node-build
  profiles: ["nodes"]
  environment:
    - SOVEREIGN_REGISTRATION_TOKEN=${SOVEREIGN_REGISTRATION_TOKEN:?set SOVEREIGN_REGISTRATION_TOKEN in .env}
    # The WireGuard data plane, in userspace (netstack) so the nodes need no extra
    # privileges. On by default: a fleet that only registers proves the control plane,
    # not the mesh, and that is how a broken overlay went unnoticed. Set
    # NERONET_DATAPLANE=off for a control-plane-only stack.
    - SOVEREIGN_DATAPLANE=${NERONET_DATAPLANE:-netstack}
    # The TCP echo the scenarios dial. It only exists when the data plane is on, and
    # it is behind the same filter as everything else, so it answers only what the
    # policy permits.
    - SOVEREIGN_OVERLAY_ECHO_PORT=${NERONET_OVERLAY_ECHO_PORT:-9999}
    # The control plane is reached over TLS, and only a certificate this CA signed
    # is accepted (scripts/dev/gen-certs.sh writes it). With NERONET_TLS_MODE=acme,
    # stack.sh sets NERONET_NODE_CA to the empty string unless a CA file was given
    # (NERONET_CONTROL_PLANE_CA_FILE): the console's certificate then comes from a CA
    # the system roots already trust. `-` and not `:-`, so that empty stays empty.
    - SOVEREIGN_CONTROL_PLANE_CA=${NERONET_NODE_CA-/run/secrets/control_plane_ca}
  secrets:
    - control_plane_ca
  depends_on:
    frontend:
      condition: service_healthy

x-derp: &derp
  <<: *node-build
  profiles: ["nodes"]
  entrypoint: ["/bin/sovereign-derp-relay"]

x-backup: &backup
  # One image for the periodic backup and for restore.sh: pg_dump/pg_restore of the
  # same major version as the server, and restic. See docker/backup/.
  build:
    context: ./docker/backup
  image: ${NERONET_BACKUP_IMAGE:-neronet-backup:dev}
  # The uid the backend runs as: the key files in its data volume are mode 0600.
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  environment:
    # Not `:?`. Compose evaluates `:?` for every service of the file, whatever its
    # profile, so a required value here would stop every existing stack from starting
    # until its .env had one. The service itself refuses to run without it.
    RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
    NERONET_BACKUP_PROJECT: ${COMPOSE_PROJECT_NAME:-}
    # The second repository: any restic repository URL. A path (/secondary is the
    # volume or directory mounted below), sftp:user@host:/path, s3:https://host/bucket,
    # rest:https://host:8000/. Empty: backups exist on this host only, and the service
    # says so on every cycle.
    NERONET_BACKUP_SECONDARY: ${NERONET_BACKUP_SECONDARY:-}
    # The password of the second repository. Empty: the same as RESTIC_PASSWORD.
    RESTIC_SECONDARY_PASSWORD: ${RESTIC_SECONDARY_PASSWORD:-}
    NERONET_BACKUP_INTERVAL: ${NERONET_BACKUP_INTERVAL:-6h}
    NERONET_BACKUP_RETRY: ${NERONET_BACKUP_RETRY:-15m}
    NERONET_BACKUP_KEEP_LAST: ${NERONET_BACKUP_KEEP_LAST:-4}
    NERONET_BACKUP_KEEP_DAILY: ${NERONET_BACKUP_KEEP_DAILY:-7}
    NERONET_BACKUP_KEEP_WEEKLY: ${NERONET_BACKUP_KEEP_WEEKLY:-4}
    NERONET_BACKUP_KEEP_MONTHLY: ${NERONET_BACKUP_KEEP_MONTHLY:-6}
    NERONET_BACKUP_SECONDARY_PRUNE: ${NERONET_BACKUP_SECONDARY_PRUNE:-true}
    NERONET_BACKUP_CHECK_SUBSET: ${NERONET_BACKUP_CHECK_SUBSET:-5%}
    # Credentials of the restic backends that use them. Empty ones are dropped.
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
    B2_ACCOUNT_ID: ${B2_ACCOUNT_ID:-}
    B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY:-}
    RESTIC_REST_USERNAME: ${RESTIC_REST_USERNAME:-}
    RESTIC_REST_PASSWORD: ${RESTIC_REST_PASSWORD:-}
    PGHOST: postgres
    PGUSER: neronet
    PGDATABASE: neronet_db
    PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  networks:
    - neronet-isolated-mesh

services:
  # 1. PostgreSQL 18
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=neronet
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=neronet_db
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neronet -d neronet_db"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - neronet-isolated-mesh

  # 2. Valkey 9.1 (Redis-compatible in-memory state bus and session store)
  valkey:
    image: valkey/valkey:9.1-alpine
    restart: unless-stopped
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - neronet-isolated-mesh

  # 3. Control plane REST and WebSocket API (Node.js 22)
  backend:
    build:
      context: ./console/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NERONET_API_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=8081
      - HOST=0.0.0.0
      # Secrets come from the environment or a local .env file, never from this
      # committed file. The `:?` form makes Compose refuse to start when one is
      # unset, which is the point: this service runs with NODE_ENV=production, so a
      # baked-in default here is a production credential published on GitHub.
      - DATABASE_URL=postgresql://neronet:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/neronet_db
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=neronet
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=neronet_db
      - VALKEY_URL=redis://valkey:6379
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - SOVEREIGN_JWT_SECRET=${SOVEREIGN_JWT_SECRET:?set SOVEREIGN_JWT_SECRET in .env}
      - SOVEREIGN_REFRESH_SECRET=${SOVEREIGN_REFRESH_SECRET:?set SOVEREIGN_REFRESH_SECRET in .env}
      - SOVEREIGN_AUDIT_HMAC_SECRET=${SOVEREIGN_AUDIT_HMAC_SECRET:?set SOVEREIGN_AUDIT_HMAC_SECRET in .env}
      - SOVEREIGN_SHRED_KEK_SECRET=${SOVEREIGN_SHRED_KEK_SECRET:?set SOVEREIGN_SHRED_KEK_SECRET in .env}
      - SOVEREIGN_SHRED_KEK_PREVIOUS=${SOVEREIGN_SHRED_KEK_PREVIOUS:-}
      - SOVEREIGN_ADMIN_PASS=${SOVEREIGN_ADMIN_PASS:?set SOVEREIGN_ADMIN_PASS in .env}
      # Who must sign in with TOTP: off, admins (super-admin, organisation owners and
      # admins) or all. Administrators without an authenticator enrol at sign-in.
      - SOVEREIGN_MFA_MANDATORY=${SOVEREIGN_MFA_MANDATORY:-admins}
      # Shared enrolment token for Go data-plane nodes. Without it the bridge refuses
      # to enrol anyone in production, since /v4/control/register writes to the node
      # table and hands out overlay addresses.
      - SOVEREIGN_REGISTRATION_TOKEN=${SOVEREIGN_REGISTRATION_TOKEN:?set SOVEREIGN_REGISTRATION_TOKEN in .env}
      # How long a node may keep running on a netmap it can no longer refresh. The
      # default is a day; the fail-static scenario lowers it so the fail-closed
      # transition can be observed in one test run.
      - SOVEREIGN_MAX_NETMAP_STALENESS_SECONDS=${NERONET_MAX_NETMAP_STALENESS_SECONDS:-86400}
      - SOVEREIGN_DATA_DIR=/app/data
      - SOVEREIGN_CONTRACT_SCHEMA_DIR=/app/api/contract/v4
      - SOVEREIGN_FEATURE_CLOUD_PC=${SOVEREIGN_FEATURE_CLOUD_PC:-false}
      # The browser origins that reach the console (TLS) and the API on the host.
      - CORS_ORIGIN=https://127.0.0.1:${NERONET_CONSOLE_PORT:-8443},https://localhost:${NERONET_CONSOLE_PORT:-8443},http://127.0.0.1:${NERONET_API_PORT:-8081},http://localhost:${NERONET_API_PORT:-8081}
    # Unprivileged, with a read-only root filesystem. Only /app/data is writable,
    # and only because the federation identity and the SQLite file live there.
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      # The mesh's Ed25519 federation identity lives here. Without a volume it is
      # regenerated on every container recreation, which silently invalidates every
      # peering token already handed to a partner.
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - neronet-isolated-mesh

  # 4. Console SPA (nginx), TLS only. Also the entry point Go nodes enrol through.
  frontend:
    build:
      context: ./console/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${NERONET_CONSOLE_BIND:-127.0.0.1}:${NERONET_CONSOLE_PORT:-8443}:8443"
    secrets:
      - console_tls_cert
      - console_tls_key
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 8443 is TLS-only; this is the loopback health listener inside the container.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8090/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - neronet-isolated-mesh

  # ---------------------------------------------------------------------------
  # Profile "nodes": a simulated fleet. Each entry is a real Go daemon enrolling
  # through nginx, not a database fixture. Countries and roles differ so discovery
  # filters and circuit selection have something to choose between.
  # ---------------------------------------------------------------------------

  # DERP relays: the fallback path for peers that cannot reach each other directly.
  # Two regions so relay selection has a choice. Each also answers STUN on UDP, which
  # is what a node behind NAT uses to learn its own public address.
  derp-eu:
    <<: *derp
    command: ["-listen-addr", "0.0.0.0:8444", "-stun-addr", "0.0.0.0:3478", "-region", "eu-central", "-decoy-title", "Apache2 Ubuntu Default Page"]
    ports:
      - "127.0.0.1:${NERONET_DERP_EU_PORT:-8444}:8444"
      - "127.0.0.1:${NERONET_STUN_EU_PORT:-3478}:3478/udp"

  derp-us:
    <<: *derp
    command: ["-listen-addr", "0.0.0.0:8444", "-stun-addr", "0.0.0.0:3478", "-region", "us-east", "-decoy-title", "Apache2 Ubuntu Default Page"]
    ports:
      - "127.0.0.1:${NERONET_DERP_US_PORT:-8445}:8444"
      - "127.0.0.1:${NERONET_STUN_US_PORT:-3479}:3478/udp"

  relay-de:
    <<: *node
    command: ["-control-url", "${NERONET_CONTROL_PLANE_URL:-https://frontend:8443}", "-country", "DE", "-enable-exit=true"]
    volumes:
      - identity-relay-de:/var/lib/neronet

  relay-fr:
    <<: *node
    command: ["-control-url", "${NERONET_CONTROL_PLANE_URL:-https://frontend:8443}", "-country", "FR", "-enable-exit=true"]
    volumes:
      - identity-relay-fr:/var/lib/neronet

  relay-us:
    <<: *node
    command: ["-control-url", "${NERONET_CONTROL_PLANE_URL:-https://frontend:8443}", "-country", "US", "-enable-exit=true"]
    volumes:
      - identity-relay-us:/var/lib/neronet

  relay-nl:
    <<: *node
    command: ["-control-url", "${NERONET_CONTROL_PLANE_URL:-https://frontend:8443}", "-country", "NL", "-enable-exit=true"]
    volumes:
      - identity-relay-nl:/var/lib/neronet

  client-it:
    <<: *node
    command: ["-control-url", "${NERONET_CONTROL_PLANE_URL:-https://frontend:8443}", "-country", "IT"]
    volumes:
      - identity-client-it:/var/lib/neronet

  client-es:
    <<: *node
    command: ["-control-url", "${NERONET_CONTROL_PLANE_URL:-https://frontend:8443}", "-country", "ES"]
    volumes:
      - identity-client-es:/var/lib/neronet

  client-uk:
    <<: *node
    command: ["-control-url", "${NERONET_CONTROL_PLANE_URL:-https://frontend:8443}", "-country", "GB"]
    volumes:
      - identity-client-uk:/var/lib/neronet

  client-us:
    <<: *node
    command: ["-control-url", "${NERONET_CONTROL_PLANE_URL:-https://frontend:8443}", "-country", "US"]
    volumes:
      - identity-client-us:/var/lib/neronet

  client-de:
    <<: *node
    command: ["-control-url", "${NERONET_CONTROL_PLANE_URL:-https://frontend:8443}", "-country", "DE"]
    volumes:
      - identity-client-de:/var/lib/neronet

  client-fr:
    <<: *node
    command: ["-control-url", "${NERONET_CONTROL_PLANE_URL:-https://frontend:8443}", "-country", "FR"]
    volumes:
      - identity-client-fr:/var/lib/neronet

  client-jp:
    <<: *node
    command: ["-control-url", "${NERONET_CONTROL_PLANE_URL:-https://frontend:8443}", "-country", "JP"]
    volumes:
      - identity-client-jp:/var/lib/neronet

  client-ch:
    <<: *node
    command: ["-control-url", "${NERONET_CONTROL_PLANE_URL:-https://frontend:8443}", "-country", "CH"]
    volumes:
      - identity-client-ch:/var/lib/neronet

  relay-se:
    <<: *node
    command: ["-control-url", "${NERONET_CONTROL_PLANE_URL:-https://frontend:8443}", "-country", "SE", "-enable-exit=true"]
    volumes:
      - identity-relay-se:/var/lib/neronet


  # ---------------------------------------------------------------------------
  # Profile "backup": a pg_dump of the database and a copy of the backend data volume
  # (the federation identity lives there: without it every peering is lost) go into
  # an encrypted restic repository every NERONET_BACKUP_INTERVAL, and from there to a
  # second repository. Start it with `scripts/dev/stack.sh backup`, or
  # `docker compose --profile backup up -d backup`. Restore with scripts/ops/restore.sh.
  #
  # The primary repository is the volume backup_repo, which lives on the same disk as
  # the database: it protects against a mistake, not against losing the disk. Point
  # NERONET_BACKUP_DIR at a directory on another disk (owned by uid 10001) and set
  # NERONET_BACKUP_SECONDARY to somewhere else again.
  # ---------------------------------------------------------------------------

  backup:
    <<: *backup
    profiles: ["backup"]
    restart: unless-stopped
    # Long enough for a running cycle to finish; restic copes with being killed, but a
    # cycle that is allowed to end leaves nothing for the next one to clean up.
    stop_grace_period: 60s
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ${NERONET_BACKUP_DIR:-backup_repo}:/repo
      - ${NERONET_BACKUP_SECONDARY_DIR:-backup_secondary}:/secondary
      - backup_cache:/cache
      - backup_work:/work
      # Read-only: the backup never changes what it backs up.
      - backend_data:/source/backend_data:ro
    healthcheck:
      # Healthy once a backup has completed, and again only while the last one is
      # recent (and the last copy to the second repository, when one is configured).
      test: ["CMD", "neronet-backup", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  # What restore.sh runs: the same image with the backend data volume writable. Run
  # with an explicit command, never started by `up`.
  backup-restore:
    <<: *backup
    profiles: ["restore"]
    command: ["status"]
    volumes:
      - ${NERONET_BACKUP_DIR:-backup_repo}:/repo
      - ${NERONET_BACKUP_SECONDARY_DIR:-backup_secondary}:/secondary
      - backup_cache:/cache
      - backup_work:/work
      - backend_data:/source/backend_data

  # A throw-away PostgreSQL for `restore.sh --verify`: the backup is restored into it
  # and compared with the live database. Its data is in memory and is gone with it.
  verify-db:
    profiles: ["restore"]
    image: postgres:18.6-alpine3.24
    environment:
      - POSTGRES_USER=neronet
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=neronet_db
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neronet -d neronet_db"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    networks:
      - neronet-isolated-mesh

  # ---------------------------------------------------------------------------
  # Profile "debug-ports": PostgreSQL and Valkey are not published by default. A
  # service cannot gain a port mapping from a profile, so each of these forwards a
  # loopback host port to the database inside the network.
  # ---------------------------------------------------------------------------

  postgres-debug:
    profiles: ["debug-ports"]
    image: alpine/socat:1.8.0.1
    restart: unless-stopped
    command: ["TCP-LISTEN:5432,fork,reuseaddr", "TCP:postgres:5432"]
    ports:
      - "127.0.0.1:${NERONET_POSTGRES_PORT:-5432}:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - neronet-isolated-mesh

  valkey-debug:
    profiles: ["debug-ports"]
    image: alpine/socat:1.8.0.1
    restart: unless-stopped
    command: ["TCP-LISTEN:6379,fork,reuseaddr", "TCP:valkey:6379"]
    ports:
      - "127.0.0.1:${NERONET_VALKEY_PORT:-6379}:6379"
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - neronet-isolated-mesh

networks:
  neronet-isolated-mesh:
    driver: bridge

# Written by scripts/dev/gen-certs.sh (stack.sh runs it when they are missing). A
# deployment points these at its own certificate, key and CA. With NERONET_TLS_MODE=acme
# the console does not use the first two (docker-compose.acme.yml), and the third only
# matters to the node fleet, when the ACME CA is not one the system roots trust.
secrets:
  console_tls_cert:
    file: ./certs/server.crt
  console_tls_key:
    file: ./certs/server.key
  control_plane_ca:
    file: ${NERONET_CONTROL_PLANE_CA_FILE:-./certs/ca.crt}

volumes:
  backend_data:
    driver: local
  postgres_data:
    driver: local
  valkey_data:
    driver: local
  # The backup repositories, used unless NERONET_BACKUP_DIR and
  # NERONET_BACKUP_SECONDARY_DIR point at a directory, and restic's cache.
  backup_repo:
  backup_secondary:
  backup_cache:
  backup_work:
  # One volume per node. The identity key inside it is what ties a container to the
  # device row it already has in the control plane; delete a volume and that
  # container comes back as a different node.
  identity-relay-de:
  identity-relay-fr:
  identity-relay-us:
  identity-relay-nl:
  identity-client-it:
  identity-client-es:
  identity-client-uk:
  identity-client-us:
  identity-client-de:
  identity-client-fr:
  identity-client-jp:
  identity-client-ch:
  identity-relay-se:
