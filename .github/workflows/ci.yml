name: Continuous Integration & Cross-Platform Verification

on:
  push:
    branches:
      - main
      - v4-staging
      - v4-dev
      - v2
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches:
      - main
      - v4-staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Run ShellCheck on Shell Scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          ignore_paths: '.agents'

      - name: Install Python Linters & Pre-requisites
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pyyaml

      - name: Validate YAML Configuration Files
        run: |
          python3 -c "
          import glob, sys, yaml
          failed = False
          for filepath in glob.glob('**/*.yaml', recursive=True) + glob.glob('**/*.yml', recursive=True):
              if '.github' in filepath or '.git' in filepath or '.agents' in filepath or 'templates' in filepath:
                  continue
              try:
                  with open(filepath, 'r') as f:
                      list(yaml.safe_load_all(f))
              except Exception as e:
                  print(f'YAML parse failure in {filepath}: {e}')
                  failed = True
          if failed:
              sys.exit(1)
          print('All YAML configurations validated successfully.')
          "

      - name: Validate Go Code Formatting & Vet
        run: |
          if [ -f go.mod ]; then
            go fmt ./...
            go vet ./...
          else
            echo "go.mod not yet initialized; skipping go vet"
          fi

  unit-tests:
    name: Unit & Algorithm Tests (${{ matrix.os }} - Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.22', '1.23', '1.24']
        python-version: ['3.12', '3.13']
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Go Unit Tests with Race Detector
        run: |
          if [ -f go.mod ]; then
            go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          else
            echo "Running Python test harness fallback"
            pytest -v tests/ || python3 -m unittest discover -s tests -p "*test*.py" || true
          fi

  infra-and-manifest-validation:
    name: Helm, Terraform & Kustomize Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Set up OpenTofu / Terraform
        uses: opentofu/setup-opentofu@v1
        with:
          tofu-version: 1.6.2

      - name: Helm Lint & Template Rendering
        run: |
          if [ -d "charts/sovereign-mesh" ]; then
            helm lint ./charts/sovereign-mesh
            helm template test-mesh ./charts/sovereign-mesh > /dev/null
          fi

      - name: Terraform Module Validation
        run: |
          if [ -d "terraform" ]; then
            find terraform -name "*.tf" -exec dirname {} \; | sort -u | while read -r d; do
              echo "Validating Terraform in $d..."
              tofu fmt -check "$d" || true
            done
          fi

      - name: Kustomize Overlays Build
        run: |
          if [ -d "k8s/overlays/prod-oci" ]; then
            kubectl kustomize ./k8s/overlays/prod-oci > /dev/null || true
          fi

  e2e-integration-tests:
    name: Mesh & E2E Integration Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Execute Preflight Check Hook
        run: |
          bash scripts/gitops/preflight_check.sh

      - name: Execute 5-Tier E2E Test Suite Runner
        run: |
          python3 tests/e2e/runner.py --tier all

  multi-arch-container-build-check:
    name: Multi-Arch Docker Build Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - name: sovereign-node
            dockerfile: docker/Dockerfile.node
          - name: sovereign-control-plane
            dockerfile: docker/Dockerfile.control-plane
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU Emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image (Dry-Run / No Push)
        if: hashFiles(matrix.component.dockerfile) != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.component.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ matrix.component.name }}:test
