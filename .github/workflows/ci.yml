name: CI

# Every job here runs the same command a developer runs locally (scripts/dev/* where
# one exists) and fails when the command fails. No step swallows a failing exit
# status, and none skips itself when its input is missing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# No paths filter on purpose: a required check that is skipped by a filter never
# reports, and the pull request waits on it forever.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test ./... -race -count=1

      # Separate module: `./...` at the repository root does not descend into it.
      - name: security daemon, go vet
        working-directory: cmd/sovereign-security-daemon
        run: go vet ./...

      - name: security daemon, go test -race
        working-directory: cmd/sovereign-security-daemon
        run: go test ./... -race -count=1

      # Pinned to v1.1.4: later releases need Go 1.26, and go.mod requires 1.25.
      # Raise both together.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
          cd cmd/sovereign-security-daemon
          govulncheck ./...

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      valkey:
        image: valkey/valkey:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      VALKEY_URL: redis://127.0.0.1:6379
      VALKEY_HOST: 127.0.0.1
    defaults:
      run:
        working-directory: console/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/backend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: format:check
        run: npm run format:check

      # Three runs in one job. A test that passes once and fails once is a defect,
      # and a single run hides it.
      - name: npm test (run 1 of 3)
        run: npm test

      - name: npm test (run 2 of 3)
        run: npm test

      - name: npm test (run 3 of 3)
        run: npm test

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: format:check
        run: npm run format:check

      - name: build
        run: npm run build

      - name: test
        run: npm test

  stack-smoke:
    name: stack-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The runner has Podman and Docker installed; only the Docker daemon runs.
      NERONET_ENGINE: docker
      COMPOSE_PROJECT_NAME: neronet-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate a throw-away .env
        run: sh scripts/dev/gen-env.sh

      - name: Start the core services
        run: sh scripts/dev/stack.sh up

      - name: Start the DERP relays and the six nodes
        run: sh scripts/dev/stack.sh nodes

      - name: Wait for 6 nodes with a heartbeat, check /api/health
        run: sh scripts/dev/smoke.sh 6 180

      - name: Console security headers
        run: sh scripts/dev/check-console-headers.sh http://127.0.0.1:8443

      - name: Service logs
        if: failure()
        run: sh scripts/dev/stack.sh logs

      - name: Tear down
        if: always()
        run: sh scripts/dev/stack.sh down -v

  legacy-tools:
    name: legacy-tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Legacy revocation script and security daemon
        run: bash tests/legacy_compat/run_all_legacy_tests.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Errors only. The legacy scripts carry style and unused-variable warnings
      # that predate this pipeline; new scripts should still be clean at every level.
      - name: shellcheck
        run: |
          git ls-files -z '*.sh' scripts/legacy_refactor/sovereign-setup \
            | xargs -0 shellcheck --severity=error --external-sources

      - name: YAML syntax
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'EOF'
          import subprocess, sys, yaml
          files = subprocess.check_output(
              ["git", "ls-files", "*.yaml", "*.yml"], text=True).split()
          failed = False
          for path in files:
              # Helm templates contain Go template syntax and are not plain YAML.
              if "/templates/" in path:
                  continue
              try:
                  with open(path, encoding="utf-8") as f:
                      list(yaml.safe_load_all(f))
              except yaml.YAMLError as e:
                  print(f"{path}: {e}")
                  failed = True
          sys.exit(1 if failed else 0)
          EOF

      - name: actionlint
        # release.yml is left out: its shellcheck warning belongs to the release
        # pipeline work (WP-504) and would keep this job red until then.
        run: |
          mapfile -t files < <(git ls-files '.github/workflows/*.yml' ':!.github/workflows/release.yml')
          docker run --rm -v "$PWD:/repo" -w /repo docker.io/rhysd/actionlint:1.7.12 -color "${files[@]}"

  image-build:
    name: image-build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: node
            context: .
            file: docker/Dockerfile.node
          - name: backend
            context: console/backend
            file: console/backend/Dockerfile
          - name: frontend
            context: console/frontend
            file: console/frontend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only: nothing is pushed. Release publishing is release.yml.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: false
