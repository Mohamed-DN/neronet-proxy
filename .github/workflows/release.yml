name: Enterprise Release Engineering & Artifact Signing

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-and-publish-containers:
    name: Build & Publish Multi-Arch Container Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          # Every component listed here must build: there is no silent skip. The
          # sovereign-honeypot image the Helm chart names has no maintained Dockerfile
          # (docker/Dockerfile.honeypot never existed), so it is not published.
          - name: sovereign-node
            dockerfile: docker/Dockerfile.node
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU Emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.component.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and Push Multi-Arch Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.component.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Cosign for Container Signing
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign Container Images with Cosign
        env:
          COSIGN_EXPERIMENTAL: "true"
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        run: |
          IMAGE_URI="ghcr.io/${{ github.repository_owner }}/${{ matrix.component.name }}:${{ github.ref_name }}"
          echo "Signing image: $IMAGE_URI"
          # One way to sign, chosen up front, and the step fails if it does not sign.
          # The old chain ended in `echo "Cosign signature recorded."`, which reported
          # a signature that had not been made.
          if [ -n "${COSIGN_KEY:-}" ]; then
            cosign sign --yes --key env://COSIGN_KEY "$IMAGE_URI"
          else
            cosign sign --yes "$IMAGE_URI"
          fi

  package-helm-and-binaries:
    name: Package Multi-Arch Binaries & Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Build Multi-Platform Binaries (Linux, Darwin, Windows)
        run: |
          mkdir -p dist
          VERSION="${{ github.ref_name }}"
          
          PLATFORMS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )
          
          BINARIES=(
            "sovereign-cli"
            "sovereign-node"
            "sovereign-derp-relay"
          )
          
          # A listed binary that is missing or does not build fails the release; a
          # release with a hole in it is not published.
          if [ -f go.mod ]; then
            for bin in "${BINARIES[@]}"; do
              [ -d "cmd/${bin}" ] || { echo "::error::cmd/${bin} does not exist"; exit 1; }
              {
                for platform in "${PLATFORMS[@]}"; do
                  platform_split=(${platform//\// })
                  GOOS=${platform_split[0]}
                  GOARCH=${platform_split[1]}
                  EXT=""
                  if [ "$GOOS" = "windows" ]; then
                    EXT=".exe"
                  fi
                  OUTPUT_NAME="${bin}-${VERSION}-${GOOS}-${GOARCH}${EXT}"
                  echo "Compiling $OUTPUT_NAME..."
                  GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="-s -w -X main.Version=${VERSION}" -o "dist/${OUTPUT_NAME}" "./cmd/${bin}"
                done
              }
            done
          fi

      - name: Package Helm Charts
        run: |
          if [ -d "charts/sovereign-mesh" ]; then
            helm package charts/sovereign-mesh/ --destination dist/
            helm repo index dist/ --url "https://${{ github.repository_owner }}.github.io/sovereign-oci-proxy/"
          fi

      - name: Generate Checksums and Sign Release Artifacts
        run: |
          bash scripts/gitops/sign_release_artifacts.sh dist/

      - name: Publish GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "Sovereign Proxy ${{ github.ref_name }} — Enterprise Decentralized Mesh"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
