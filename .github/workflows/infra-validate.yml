name: Infrastructure validation

# Decision D6: the first deployment target is a single VM with Compose; Kubernetes
# and OpenShift come later. The Helm chart stays validated. OpenTofu, Terraform and
# Kustomize validation was removed with the decision. Those checks swallowed their
# own exit status and could not fail.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helm:
    name: helm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.0

      - name: helm lint
        run: helm lint ./charts/sovereign-mesh

      - name: helm template
        run: helm template test-instance ./charts/sovereign-mesh > /dev/null

  cluster-spec:
    name: cluster-spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: python3 -m pip install --quiet pyyaml

      - name: Validate configs/mesh-cluster.yaml
        run: python3 scripts/gitops/sync_cluster_state.py --config configs/mesh-cluster.yaml --command validate
