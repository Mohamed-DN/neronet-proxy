{{- if not .Values.secrets.existingSecret }}
{{- /*
  A value not given in .Values is generated once and then kept: an upgrade reads it
  back from the Secret already in the cluster. Generating it again on every upgrade
  changed the PostgreSQL password the database was initialised with, signed every
  session out, broke verification of the audit chain, and -- for the shredding key --
  would make every organisation's sealed secrets unreadable.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "neronet.secretName" .) }}
{{- $data := dict }}
{{- if and $existing $existing.data }}{{- $data = $existing.data }}{{- end }}
{{- $keep := dict "jwt-secret" 64 "refresh-secret" 64 "audit-hmac-secret" 64 "shred-kek-secret" 64 "admin-password" 32 "registration-token" 48 "postgres-password" 32 }}
{{- $given := dict "jwt-secret" .Values.secrets.jwtSecret "refresh-secret" .Values.secrets.refreshSecret "audit-hmac-secret" .Values.secrets.auditHmacSecret "shred-kek-secret" .Values.secrets.shredKekSecret "admin-password" .Values.secrets.adminPassword "registration-token" .Values.secrets.registrationToken "postgres-password" .Values.secrets.postgresPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "neronet.secretName" . }}
  labels:
    {{- include "neronet.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
{{- range $key := keys $keep | sortAlpha }}
  {{ $key }}: {{ get $given $key | default (get $data $key | b64dec) | default (randAlphaNum (get $keep $key)) | quote }}
{{- end }}
{{- end }}
