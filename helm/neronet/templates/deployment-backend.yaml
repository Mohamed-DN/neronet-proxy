apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "neronet.fullname" . }}-backend
  labels:
    {{- include "neronet.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "neronet.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "neronet.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "neronet.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.backend.securityContext.runAsUser }}
        fsGroup: {{ .Values.backend.securityContext.runAsUser }}
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}-backend:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "{{ .Values.backend.port }}"
            - name: SOVEREIGN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "neronet.secretName" . }}
                  key: jwt-secret
            - name: SOVEREIGN_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "neronet.secretName" . }}
                  key: refresh-secret
            - name: SOVEREIGN_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "neronet.secretName" . }}
                  key: admin-password
            - name: SOVEREIGN_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "neronet.secretName" . }}
                  key: registration-token
            - name: DATABASE_URL
              value: "postgresql://neronet:$(POSTGRES_PASSWORD)@{{ include "neronet.fullname" . }}-postgres:5432/neronet_db"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "neronet.secretName" . }}
                  key: postgres-password
            - name: VALKEY_URL
              value: "redis://{{ include "neronet.fullname" . }}-valkey:6379"
            - name: SOVEREIGN_DATA_DIR
              value: /app/data
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "neronet.fullname" . }}-backend-data
        - name: tmp
          emptyDir: {}
