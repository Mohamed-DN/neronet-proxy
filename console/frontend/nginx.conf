server {
    listen 8443;
    server_name localhost 127.0.0.1;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA Frontend Static Routing
    #
    # The security headers live here and not in the server block. An add_header in
    # the server block is inherited by every location that sets none of its own, so
    # the proxied locations below were sending nginx's values alongside the
    # backend's: /api answers carried X-Frame-Options twice, DENY from the backend
    # and SAMEORIGIN from here. Two values for one header is not a stricter policy,
    # it is one the client resolves however it likes.
    #
    # The document itself is served by nginx, so nginx is the only place that can
    # give it a policy. It had none at all: the CSP that the backend sets applied to
    # JSON responses and never to the page that runs the scripts.
    location / {
        try_files $uri $uri/ /index.html;

        # Equivalent to the backend's policy and tighter: no ws:/wss: source, because
        # 'self' already covers the console's WebSocket on this origin, and no
        # upgrade-insecure-requests while the edge serves plain HTTP.
        #
        # script-src stays 'self' with no inline exception: the built index.html
        # loads its bundle by src and contains no inline script.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        # frame-ancestors 'none' above is the control that matters; this is for
        # clients that predate CSP level 2.
        add_header X-Frame-Options "DENY" always;
        # The console uses none of these, and an unused permission is one an injected
        # script can use.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # Go Mesh Data Plane Proxy
    location /v4/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Control Plane REST API Proxy
    location /api/ {
        proxy_pass http://backend:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Real-Time WebSocket Topology Hub Proxy
    location /ws/ {
        proxy_pass http://backend:8081/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Warrant Canary Direct Endpoint Proxy
    location /.well-known/ {
        proxy_pass http://backend:8081/.well-known/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # No security headers at the server level: see the comment in location /. The
    # proxied locations pass the backend's headers through untouched, so each one
    # arrives exactly once.
    #
    # No Strict-Transport-Security either. The edge serves plain HTTP; HSTS arrives
    # with TLS in WP-304, and sending it now would pin a development origin to HTTPS
    # in the browser of everyone who opened it.
}
