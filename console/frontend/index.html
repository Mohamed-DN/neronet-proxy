<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f4f3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1a22" />
    <meta name="description" content="NeroNet management console" />
    <title>NeroNet</title>
    <!-- Fonts (Overpass, Overpass Mono) are bundled and served from this origin;
         see src/styles/fonts.css. The console runs under default-src 'self',
         and no operator address may reach a font CDN. -->
    <!-- Sets data-theme before the first paint, from the stored preference or
         prefers-color-scheme, so the console is never drawn in the wrong theme
         and repainted. A separate file and not inline: script-src is 'self'. -->
    <script src="/theme-init.js"></script>
  </head>
  <body class="min-h-screen overflow-x-hidden bg-surface text-content antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
