# ==============================================================================
# NeroNet Sovereign Mesh - HAProxy Configuration for Patroni Cluster
# Health-checks Patroni REST API endpoints to dynamically route read/write
# ==============================================================================

global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    retries 3

# Primary Read/Write Pool (Port 5000 / 5432)
# Checks /primary endpoint of Patroni HTTP API (port 8008)
frontend postgres_primary_front
    bind 0.0.0.0:5000
    default_backend postgres_primary_back

backend postgres_primary_back
    mode tcp
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni-1 patroni-1:5432 maxconn 200 check port 8008
    server patroni-2 patroni-2:5432 maxconn 200 check port 8008
    server patroni-3 patroni-3:5432 maxconn 200 check port 8008

# Replicas Read-Only Pool (Port 5001 / 5433)
# Checks /replica endpoint of Patroni HTTP API (port 8008)
frontend postgres_replicas_front
    bind 0.0.0.0:5001
    default_backend postgres_replicas_back

backend postgres_replicas_back
    mode tcp
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2
    server patroni-1 patroni-1:5432 maxconn 200 check port 8008
    server patroni-2 patroni-2:5432 maxconn 200 check port 8008
    server patroni-3 patroni-3:5432 maxconn 200 check port 8008
