# ==============================================================================
# Sovereign Proxy v4.0 - Master Nginx Configuration
# Location: configs/nginx/nginx.conf
# ==============================================================================

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Logging Format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main buffer=16k flush=2m;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # SSL / TLS Modern Protocols
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Hybrid post-quantum key exchange, offered ahead of classical X25519.
    #
    # This addresses "harvest now, decrypt later": an adversary recording this
    # traffic today can store it until a cryptographically relevant quantum
    # computer exists, at which point a classical-only X25519 handshake yields the
    # session key retroactively. The hybrid group concatenates the X25519 and
    # ML-KEM-768 secrets, so the session stays protected as long as either one
    # holds -- which matters because ML-KEM is young and should not be relied on
    # alone.
    #
    # Requires OpenSSL 3.5 or newer. On an older build nginx fails to start with
    # an unknown-curve error rather than falling back silently, which is the
    # behaviour we want: a silent downgrade here would be invisible. X25519 is
    # listed second so clients that do not support the hybrid group still connect.
    #
    # Verify with:
    #   openssl s_client -groups X25519MLKEM768 -connect <host>:443
    ssl_ecdh_curve X25519MLKEM768:X25519;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Include Site Configurations
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
