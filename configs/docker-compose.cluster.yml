# Sovereign Proxy v4.0 — Multi-Service Production Docker Compose Stack
version: '3.8'

services:
  # 1. High-Availability Control Plane & Coordination Daemon
  control-plane:
    image: ghcr.io/mohamed-dn/sovereign-control-plane:4.0.0
    container_name: sovereign-control-plane
    restart: unless-stopped
    ports:
      - "8443:8443" # HTTPS REST API
      - "9443:9443" # gRPC Peer Coordination
    environment:
      - CLUSTER_DOMAIN=neronet.darknero.com
      - RAFT_DATA_DIR=/var/lib/sovereign/raft
      - LOG_LEVEL=info
    volumes:
      - sovereign-raft-data:/var/lib/sovereign/raft
      - /opt/sovereign/certs:/etc/sovereign/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8443/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # 2. Sovereign STUN/DERP Relay & Core Routing Engine
  relay-node:
    image: ghcr.io/mohamed-dn/sovereign-derp-relay:4.0.0
    container_name: sovereign-derp-relay
    restart: unless-stopped
    network_mode: "host" # Line-rate kernel packet routing for low-latency STUN & DERP
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /opt/sovereign/config/node.env:/etc/sovereign/node.env:ro
      - /opt/sovereign/data:/var/lib/sovereign:rw
      - /opt/sovereign/certs:/etc/sovereign/certs:ro
    environment:
      - SOVEREIGN_CONFIG_PATH=/etc/sovereign/node.env
      - DECOY_DOMAIN=aws.amazon.com
      - STUN_PORT=3478
      - DERP_PORT=443
    depends_on:
      - control-plane
      - decoy-gateway
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:443/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # 3. Decoy Anti-Censorship Reverse Proxy (Nginx Mimicry)
  decoy-gateway:
    image: nginx:1.27-alpine
    container_name: sovereign-decoy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8444:8443"
    volumes:
      - /opt/sovereign/config/nginx-decoy.conf:/etc/nginx/nginx.conf:ro
      - /opt/sovereign/www-decoy:/usr/share/nginx/html:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

  # 4. Active Port Scanner Honeypot Sensor
  honeypot-sensor:
    image: ghcr.io/mohamed-dn/sovereign-honeypot:4.0.0
    container_name: sovereign-honeypot
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/log/sovereign/honeypot.log:/var/log/honeypot.log:rw
    environment:
      - BAN_THRESHOLD=2
      - BAN_DURATION_HOURS=72
      - AUTO_UFW_BAN=true
    cap_add:
      - NET_ADMIN

  # 5. Prometheus Telemetry & Metrics Exporter
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: sovereign-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - /opt/sovereign/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'

  # 6. Host System Metrics Exporter
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: sovereign-node-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  # 7. Automated Health Watcher & Failover Sidecar
  health-watcher:
    image: ghcr.io/mohamed-dn/sovereign-watcher:4.0.0
    container_name: sovereign-health-watcher
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/sovereign/config/node.env:/etc/sovereign/node.env:ro
    environment:
      - CHECK_INTERVAL_SEC=15
      - FAILOVER_THRESHOLD=3

volumes:
  sovereign-raft-data:
    name: sovereign-raft-data
  prometheus-data:
    name: sovereign-prometheus-data
