# Simulated mesh nodes for testing the console against a real fleet.
#
# Each entry is a genuine Go daemon enrolling through nginx, not a database fixture.
# Countries and roles differ so discovery filters and circuit selection have
# something to choose between.
services:
  relay-de:
    image: sovereign-node:current
    container_name: neronet_relay_de
    restart: unless-stopped
    environment:
      - SOVEREIGN_REGISTRATION_TOKEN=${SOVEREIGN_REGISTRATION_TOKEN:?set SOVEREIGN_REGISTRATION_TOKEN in .env}
    command: ["-control-url", "http://frontend:8443", "-country", "DE", "-enable-exit=true"]
    networks: [neronet-isolated-mesh]

  relay-fr:
    image: sovereign-node:current
    container_name: neronet_relay_fr
    restart: unless-stopped
    environment:
      - SOVEREIGN_REGISTRATION_TOKEN=${SOVEREIGN_REGISTRATION_TOKEN:?set SOVEREIGN_REGISTRATION_TOKEN in .env}
    command: ["-control-url", "http://frontend:8443", "-country", "FR", "-enable-exit=true"]
    networks: [neronet-isolated-mesh]

  relay-us:
