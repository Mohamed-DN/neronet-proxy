# Gitleaks configuration. CI runs it over the full history on every push, every pull
# request and nightly (.github/workflows/security-scan.yml).
#
# Each allowlist below names one path and the rules that fire there, and says why the
# finding is not a secret. Adding a path here needs the same explanation. Findings in
# product code that are real go in .gitleaksignore, one fingerprint per line, never
# here.

title = "NeroNet gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Sample WireGuard-style preshared keys in the console's offline demo data. Random-looking base64 that belongs to no node."
targetRules = ["generic-api-key"]
paths = ['''^console/frontend/src/services/mockData\.js$''']

[[allowlists]]
description = "Test fixtures for the nuke routes: passwords and confirmation strings posted to a test server."
targetRules = ["generic-api-key"]
paths = ['''^console/backend/tests/m3_nuke\.test\.js$''']

[[allowlists]]
description = "Go test that sets an environment variable to a placeholder to check that the config loader reads it."
targetRules = ["generic-api-key"]
paths = ['''^pkg/config/env_test\.go$''']

[[allowlists]]
description = "Go test of node enrolment. The commit that added it wrote the pre-auth key it hands to an httptest server as a literal; the test now generates it with crypto/rand. Only that commit still contains the literal, and it was never a key issued by a control plane."
condition = "AND"
targetRules = ["generic-api-key"]
commits = ["eec2abee3ad7296d144fbf101a1cf9c0a013e5ed"]
paths = ['''^pkg/control/client_test\.go$''']

[[allowlists]]
description = "Removed Python E2E suite (tests/e2e, deleted in WP-002). Fake bearer tokens with a literal BAD signature and a reversed sample password, plus a docstring naming a cipher. Only history still contains it."
targetRules = ["generic-api-key", "jwt"]
paths = ['''^tests/e2e/(console_e2e\.py|tier1_features/test_f09_crypto_overlay\.py)$''']

[[allowlists]]
description = "Stress script that sends a syntactically valid JWT with a literal BAD signature to check that the console rejects it."
targetRules = ["generic-api-key", "jwt"]
paths = ['''^tests/stress/challenger_frontend_staging_stress\.py$''']

[[allowlists]]
description = "Documentation. A WireGuard public key printed in an example, and a placeholder enrolment token in a command line."
targetRules = ["generic-api-key"]
paths = ['''^(DEVELOPER_SETUP|BUSINESS_AND_ROADMAP)\.md$''']

[[allowlists]]
description = "Architecture decision records. Prose that describes key handling (for example 'key per hop, ...') and matches the generic key pattern. No ADR carries a credential."
targetRules = ["generic-api-key"]
paths = ['''^docs/adr/.*\.md$''']

[[allowlists]]
description = "Test fixtures and test keys in third-party carved packages (Tailscale DERP mesh keys in unit tests)."
targetRules = ["generic-api-key"]
paths = ['''^third_party/.*_test\.go$''']

[[allowlists]]
description = "Frontend tests of the invitation flow. TOKEN is the base64url of the ASCII phrase 'Chiave-di-prova-larga-32-bytes-x' (Italian for 'long test key'), a placeholder shaped like a 32-byte invite token. The tests post it to a mocked fetch; no control plane ever issued it."
targetRules = ["generic-api-key"]
paths = [
  '''^console/frontend/src/portal/InviteAcceptRoute\.test\.tsx$''',
  '''^console/frontend/src/routes/pages/invitations/InvitationsPanel\.test\.tsx$''',
]

[[allowlists]]
description = "Test of the Cloudflare DDNS kit. TOKEN is a made-up string ('cfT0ken_SECRET-...') that the test writes into a temporary config and checks the script handles without leaking it. It is not a Cloudflare API token."
targetRules = ["generic-api-key"]
paths = ['''^scripts/ops/cloudflare-ddns/test\.sh$''']

[[allowlists]]
description = "Go test of the transport multiplexer. 'key' is a hex peer identifier used as a map key for a peerState built in memory; it is a public-key-shaped constant of the test, not a private key or credential."
targetRules = ["generic-api-key"]
paths = ['''^pkg/transport/mux_fallback_test\.go$''']

[[allowlists]]
description = "Frontend test of the add-device flow. 'secret' is the hex counting sequence 0123456789abcdef repeated, a placeholder returned by a stubbed register call."
targetRules = ["generic-api-key"]
paths = ['''^console/frontend/src/portal/AddDeviceRoute\.test\.tsx$''']

[[allowlists]]
description = "Overlay scenario script. Sec-WebSocket-Key is the sample nonce from RFC 6455 section 1.3 (base64 of 'the sample nonce'), sent in a hand-written WebSocket upgrade request. It is public and protects nothing."
targetRules = ["generic-api-key"]
paths = ['''^scripts/dev/scenarios/overlay\.sh$''']
