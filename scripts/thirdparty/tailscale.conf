# Tailscale, BSD-3-Clause (LICENSE in the clone root, read 2026-09-20).
# Every setting can be overridden from the environment, which is how the
# per-organ measurements in the transplant report were made.
UP_MODULE=tailscale.com
LICENSE_FILES="LICENSE PATENTS"
CARVE_GOOS=${CARVE_GOOS:-"linux windows"}
GO_IMAGE=${GO_IMAGE:-docker.io/library/golang:1.27}
ALL_TESTS=${ALL_TESTS:-0}

# Organ A: the DERP protocol, its HTTP client and server, STUN, disco.
ROOTS=${ROOTS:-"./derp ./derp/derphttp ./derp/derpserver ./net/stun ./disco"}

# derpserver asks a local tailscaled whether a client key is a known node. NeroNet
# has no tailscaled; admission goes through the control plane (verifyClientsURL).
SHIMS=${SHIMS-"tailscale.com/client/local=github.com/sovereign/proxy/v4/pkg/transplant/shim/local"}
